
name: build-rootful-ios12-plus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      IOS12_SDK_VERSION: "16.5"
      IOS12_ARCHS: "arm64"
      DEVICE_TARGET: "iphone:clang:16.5:12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: ios12-rootful-sdk-16.5-fixed-v2

      - name: Download and Validate SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$GITHUB_WORKSPACE/theos/sdks"
          SDK_PATH="$SDK_DIR/iPhoneOS16.5.sdk"
          FOUNDATION="$SDK_PATH/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

          mkdir -p "$SDK_DIR"

          # Remove incomplete SDK
          if [ ! -f "$FOUNDATION" ]; then
            rm -rf "$SDK_PATH"

            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT

            curl -fL --retry 3 \
              https://github.com/theos/sdks/archive/refs/heads/master.zip \
              -o "$TMP_DIR/sdks.zip"

            # Extract while preserving SDK symbolic links
            unzip -q "$TMP_DIR/sdks.zip" -d "$TMP_DIR"

            SOURCE="$TMP_DIR/sdks-master/iPhoneOS16.5.sdk"

            if [ ! -f "$SOURCE/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h" ]; then
              echo "::error::Downloaded SDK is missing Foundation.h"
              exit 1
            fi

            cp -a "$SOURCE" "$SDK_PATH"
          fi

          # Validate essential SDK headers
          test -f "$FOUNDATION"

          echo "Foundation SDK header:"
          ls -l "$FOUNDATION"

          echo "SDK validation successful."

      - name: Setup environment
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Verify Build Environment
        run: |
          set -euo pipefail

          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

          echo "Theos: $THEOS"
          echo "SDK: iPhoneOS16.5.sdk"
          echo "Architecture: arm64"

      - name: Build Rootful iOS 12+
        run: |
          set -euo pipefail

          make clean

          make package \
            ARCHS=arm64 \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=

          mkdir -p artifacts

          find packages -maxdepth 1 -type f -name '*.deb' -exec cp {} artifacts/ \;

          test "$(find artifacts -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')" -eq 1

      - name: Upload Rootful DEB
        uses: actions/upload-artifact@v4
        with:
          name: rootful-ios12-plus
          path: artifacts/*.deb
          if-no-files-found: error
