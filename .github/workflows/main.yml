name: build-rootful-ios12-plus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      IOS12_SDK_VERSION: "16.5"
      IOS12_ARCHS: "arm64"
      DEVICE_TARGET: "iphone:clang:16.5:12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: ios12-rootful-sdk-16.5

      
      - name: Download SDK
        run: |
          set -euo pipefail

          SDK_DIR="theos/sdks"
          mkdir -p "$SDK_DIR"

          if [ ! -d "$SDK_DIR/iPhoneOS16.5.sdk" ]; then
            curl -fL --retry 3 \
              https://github.com/theos/sdks/archive/master.zip \
              -o sdks.zip

            python3 - <<'PY'
          import zipfile
          import os
          import stat

          archive = zipfile.ZipFile("sdks.zip")
          destination = "theos/sdks"

          for item in archive.infolist():
              name = item.filename

              if not name.startswith("sdks-master/"):
                  continue

              relative = name[len("sdks-master/"):]
              if not relative:
                  continue

              mode = item.external_attr >> 16

              # Skip symbolic links and special files
              if stat.S_ISLNK(mode):
                  continue

              if not (item.is_dir() or stat.S_ISREG(mode)):
                  continue

              target = os.path.join(destination, relative)

              if item.is_dir():
                  os.makedirs(target, exist_ok=True)
              else:
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  with archive.open(item) as source:
                      with open(target, "wb") as output:
                          output.write(source.read())

          archive.close()
          PY

            rm -f sdks.zip
          fi

          test -d "$SDK_DIR/iPhoneOS16.5.sdk"

      - name: Setup environment
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build Rootful iOS 12+
        run: |
          set -euo pipefail

          make clean

          make package \
            ARCHS=arm64 \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=

          mkdir -p artifacts
          find packages -maxdepth 1 -type f -name '*.deb' -exec cp {} artifacts/ \;

          test "$(find artifacts -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')" -eq 1

      - name: Upload Rootful DEB
        uses: actions/upload-artifact@v4
        with:
          name: rootful-ios12-plus
          path: artifacts/*.deb
          if-no-files-found: error
