name: "build-rootful-ios12"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      IOS12_SDK_VERSION: "16.5"
      IOS12_ARCHS: "arm64"
      DEVICE_TARGET: "iphone:clang:16.5:12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: ios12-rootful-sdk-16.5-symlink-v3

      - name: Download and Install iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$GITHUB_WORKSPACE/theos/sdks"
          SDK_PATH="$SDK_DIR/iPhoneOS16.5.sdk"
          FOUNDATION="$SDK_PATH/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

          mkdir -p "$SDK_DIR"

          if [ ! -f "$FOUNDATION" ]; then
            echo "SDK missing or incomplete. Reinstalling..."

            rm -rf "$SDK_PATH"

            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT

            curl -fL --retry 3 \
              https://github.com/theos/sdks/archive/refs/heads/master.zip \
              -o "$TMP_DIR/sdks.zip"

            python3 - "$TMP_DIR/sdks.zip" "$SDK_DIR" <<'PY'
          import os
          import sys
          import stat
          import zipfile

          archive_path = sys.argv[1]
          destination = os.path.abspath(sys.argv[2])
          prefix = "sdks-master/iPhoneOS16.5.sdk/"

          os.makedirs(destination, exist_ok=True)

          with zipfile.ZipFile(archive_path) as archive:
              entries = []

              for item in archive.infolist():
                  name = item.filename

                  if not name.startswith(prefix):
                      continue

                  relative = name[len("sdks-master/"):]
                  target = os.path.abspath(
                      os.path.join(destination, relative)
                  )

                  if os.path.commonpath([destination, target]) != destination:
                      raise RuntimeError("Unsafe SDK archive path: " + name)

                  mode = item.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      entries.append(("symlink", item, target))
                  elif item.is_dir():
                      entries.append(("directory", item, target))
                  else:
                      entries.append(("file", item, target))

              # Create directories first.
              for kind, item, target in entries:
                  if kind == "directory":
                      os.makedirs(target, exist_ok=True)

              # Extract normal files.
              for kind, item, target in entries:
                  if kind != "file":
                      continue

                  os.makedirs(os.path.dirname(target), exist_ok=True)

                  with archive.open(item) as source:
                      with open(target, "wb") as output:
                          while True:
                              chunk = source.read(1024 * 1024)
                              if not chunk:
                                  break
                              output.write(chunk)

                  mode = item.external_attr >> 16
                  permissions = stat.S_IMODE(mode)

                  if permissions:
                      os.chmod(target, permissions)

              # Restore genuine symbolic links.
              for kind, item, target in entries:
                  if kind != "symlink":
                      continue

                  os.makedirs(os.path.dirname(target), exist_ok=True)

                  link_target = archive.read(item).decode("utf-8")

                  if os.path.lexists(target):
                      raise RuntimeError(
                          "SDK path collision: " + target
                      )

                  os.symlink(link_target, target)

          print("SDK extraction completed.")
          print("Symbolic links restored.")
          PY
          fi

          # Verify essential SDK headers.
          test -f "$FOUNDATION"

          test -d "$SDK_PATH/System/Library/Frameworks/IOKit.framework/Headers"
          test -d "$SDK_PATH/System/Library/Frameworks/UIKit.framework/Headers"
          test -d "$SDK_PATH/System/Library/Frameworks/CoreFoundation.framework/Headers"

          echo "Foundation.h:"
          ls -l "$FOUNDATION"

          echo "iOS SDK 16.5 validation successful."

      - name: Setup Theos Environment
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "THEOS=$THEOS"
          echo "SDK=$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "ARCHS=$IOS12_ARCHS"
          echo "TARGET=$DEVICE_TARGET"

          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

      - name: Build Rootful iOS 12+
        shell: bash
        run: |
          set -euo pipefail

          make clean

          make package \
            ARCHS="$IOS12_ARCHS" \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=

          mkdir -p artifacts

          find packages \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -exec cp {} artifacts/ \;

          DEB_COUNT=$(find artifacts -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')

          if [ "$DEB_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one DEB, found $DEB_COUNT"
            exit 1
          fi

          echo "Build completed:"
          ls -lh artifacts/*.deb

      - name: Upload Rootful DEB
        uses: actions/upload-artifact@v4
        with:
          name: rootful-ios12-plus
          path: artifacts/*.deb
          if-no-files-found: error
