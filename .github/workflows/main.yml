name: build-rootful-ios12-plus

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      IOS12_SDK_VERSION: "16.5"
      IOS12_ARCHS: "arm64"
      DEVICE_TARGET: "iphone:clang:16.5:12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: theos/sdks
          key: ios12-rootful-sdk-16.5-fixed-v2

      - name: Download and Validate SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$GITHUB_WORKSPACE/theos/sdks"
          SDK_PATH="$SDK_DIR/iPhoneOS16.5.sdk"
          FOUNDATION="$SDK_PATH/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

          mkdir -p "$SDK_DIR"

          if [ ! -f "$FOUNDATION" ]; then
            rm -rf "$SDK_PATH"

            TMP_DIR="$(mktemp -d)"
            trap 'rm -rf "$TMP_DIR"' EXIT

            curl -fL --retry 3 \
              https://github.com/theos/sdks/archive/refs/heads/master.zip \
              -o "$TMP_DIR/sdks.zip"

            python3 - "$TMP_DIR/sdks.zip" "$TMP_DIR/extracted" <<'PY'
          import os
          import sys
          import stat
          import zipfile

          archive_path, destination = sys.argv[1:3]
          os.makedirs(destination, exist_ok=True)

          with zipfile.ZipFile(archive_path) as archive:
              members = archive.infolist()

              # Extract regular files and directories first.
              for item in members:
                  name = item.filename

                  if not name.startswith("sdks-master/iPhoneOS16.5.sdk/"):
                      continue

                  relative = name[len("sdks-master/"):]
                  target = os.path.join(destination, relative)

                  mode = item.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      continue

                  if item.is_dir():
                      os.makedirs(target, exist_ok=True)
                  elif stat.S_ISREG(mode) or mode == 0:
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with archive.open(item) as src, open(target, "wb") as dst:
                          dst.write(src.read())

              # Resolve symlink entries as regular copies.
              pending = [
                  item for item in members
                  if item.filename.startswith("sdks-master/iPhoneOS16.5.sdk/")
                  and stat.S_ISLNK(item.external_attr >> 16)
              ]

              for item in pending:
                  relative = item.filename[len("sdks-master/"):]
                  target = os.path.join(destination, relative)

                  link = archive.read(item).decode("utf-8")
                  source_dir = os.path.dirname(target)
                  resolved = os.path.normpath(os.path.join(source_dir, link))

                  if os.path.commonpath([destination, resolved]) != destination:
                      raise RuntimeError("SDK symlink escapes extraction directory")

                  if os.path.isfile(resolved):
                      os.makedirs(source_dir, exist_ok=True)
                      import shutil
                      shutil.copy2(resolved, target)

                  elif os.path.isdir(resolved):
                      os.makedirs(source_dir, exist_ok=True)
                      import shutil
                      shutil.copytree(resolved, target, dirs_exist_ok=True)

                  else:
                      raise RuntimeError(
                          f"Unresolved SDK symlink: {relative} -> {link}"
                      )

          print("SDK extraction completed.")
          PY

            cp -a "$TMP_DIR/extracted/iPhoneOS16.5.sdk" "$SDK_PATH"
          fi

          test -f "$FOUNDATION"

          echo "Foundation.h verified."
          echo "SDK validation successful."


      - name: Setup environment
        run: |
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Verify Build Environment
        run: |
          set -euo pipefail

          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

          echo "Theos: $THEOS"
          echo "SDK: iPhoneOS16.5.sdk"
          echo "Architecture: arm64"

      - name: Build Rootful iOS 12+
        run: |
          set -euo pipefail

          make clean

          make package \
            ARCHS=arm64 \
            TARGET="$DEVICE_TARGET" \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=

          mkdir -p artifacts

          find packages -maxdepth 1 -type f -name '*.deb' -exec cp {} artifacts/ \;

          test "$(find artifacts -maxdepth 1 -name '*.deb' | wc -l | tr -d ' ')" -eq 1

      - name: Upload Rootful DEB
        uses: actions/upload-artifact@v4
        with:
          name: rootful-ios12-plus
          path: artifacts/*.deb
          if-no-files-found: error
